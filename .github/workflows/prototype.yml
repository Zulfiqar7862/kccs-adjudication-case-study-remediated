name: Prototype
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'prototype[dev]'
      - run: python -m pytest prototype/tests
      - run: python -m adjudication.synthetic prototype/output/synthetic.xlsx
      - run: python -m adjudication.cli run --workbook prototype/output/synthetic.xlsx --output-dir prototype/output/synthetic --as-at 2026-01-10T12:00:00+00:00
      - name: Assert synthetic CLI files and count
        run: python -c "import json,pathlib; p=pathlib.Path('prototype/output/synthetic'); assert json.loads((p/'adjudication_report.json').read_text())['record_counts']['excursion_events']==2; assert len(list(p.iterdir()))==7"
